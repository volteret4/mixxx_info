# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  mixxx-info:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - .:/app
      - "${MIX:?Pon en .env tu carpeta Mix (MIX)}:/mnt/windows/Mix:ro"
    ports:
      - "${PUERTO:-8754}:8000"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "mixxx_info"
      ofelia.job-exec.mixxx-info-update.schedule: "0 30 5 * * *"
      ofelia.job-exec.mixxx-info-update.command: "nice -n 19 ionice -c 3 python main.py update"
      ofelia.job-exec.mixxx-info-update.no-overlap: "true"

  mixxx-info-web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - mixxx-info
    ports:
      - "${PUERTO_MIXXX_INFO_WEB:-8755}:80"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=mixxx_info
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mixxx-info
